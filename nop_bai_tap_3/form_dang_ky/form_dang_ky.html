<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login CodeGym</title>
</head>
<body>
<form style="width: 400px;
    margin: auto;
    padding: 30px;
    border: 10px solid pink;
    border-radius: 30px;">
    <h1>Đăng Ký</h1>
    <label for="ho_va_ten">Họ Và Tên</label>
    <input type="text" placeholder="nhập họ tên" required id="ho_va_ten" name="ho_va_ten"><br>
    <label for="email">Email:</label>
    <input type="email" placeholder="example@gmail.com" required id="email" name="email"><br>
    <label for="sdt">Số Điện Thoại:</label>
    <input type="number" placeholder="số điện thoại" required id="sdt" name="sdt"><br>
    <label for="password">Password:</label>
    <input type="password" required id="password" name="password"><br>
    <label>Giới Tính:</label><br>
    <label for="male">Nam</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="Female">Nữ</label>
    <input type="radio" id="female" name="gender" value="female"><br>
    <button type="submit">Đăng Ký</button>
</form>
</body>
</html>
