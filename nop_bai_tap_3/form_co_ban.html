<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Xin Cái Infor</title>
</head>
<body>
<form style="width: 400px;
    margin: auto;
    padding: 30px;
    border: 10px solid pink;
    border-radius: 30px;">
    <h1>Người Anh Em Ở Đâu?</h1>
    <img src="images.jpg" height="250" width="400"/>
    <label for="dia_chi">Địa Chỉ:</label>
    <input required placeholder="Nhập tên đường" type="text" id="dia_chi" name="dia_chi"><br>
    <label for="so_nha">Số Nhà:</label>
    <input required placeholder="Nhập Số Nhà" type="number" min="1" max="9999
" id="so_nha" name="so_nha"><br>
    <label for="thanh_pho">Thành Phố:</label>
    <input required placeholder="Nhập tên thành phố" type="text" id="thanh_pho" name="thanh_pho"><br>
    <label>Kết bạn với tao?</label>
    <input type="radio" name="traloi" value="co">
    <label>Ok</label>
    <input type="radio" name="traloi" value="co">
    <label>có</label><br>
    <label>Kết bạn bằng?</label>
    <input type="checkbox" value="mxh">
    <label>Instagram</label>
    <input type="checkbox" value="mxh">
    <label>Zalo</label>
    <input type="checkbox" value="mxh">
    <label>Facebook</label><br>
    <input type="submit" value="Gửi cho tao">
    <input type="reset" value="Nhập lại từ đầu">
</form>
</body>
</html>
