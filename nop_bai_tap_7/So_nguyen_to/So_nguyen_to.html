<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Số Nguyên tố</title>
</head>
<body>
<h1>20 Số nguyên tố đầu tiên</h1>
<input id="soNguyenTo" type="number" placeholder="nhập số lượng số nguyên tố muốn kiểm tra"
       style="text-align: center ; width:300px ; border: 2px dashed;" min="0" max="20" step="1">
<button id="kiemTra" onclick="ktra()">kiểm tra</button>
<p id="ketQua"></p>
<script>
    function ktra() {
        let soNguyenTo = document.getElementById("soNguyenTo").value;
        let count = 0;
        let N = 2;
        while (count < soNguyenTo) {
            let laSoNguyenTo = true;
            for (let i = 2; i < N; i++) {
                if (N % i === 0) {
                    laSoNguyenTo = false;
                    break;
                }
            }
            if (laSoNguyenTo === true) {
                document.getElementById("ketQua").innerHTML += N + "" + "_";
                count++;
            }
            N++;
        }
    }
</script>
</body>
</html>
