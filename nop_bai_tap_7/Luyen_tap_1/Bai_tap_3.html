<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dãy Số Fibonacci</title>
</head>
<body>
<script>
    let so1 = 1;
    let so2 = 1;
    for (let i = 1; i <= 20; i++) {
        if (so1 < so2) {
            document.write(so1+'<br>');
            so1 = so1 + so2;

        }
    else
        {
            document.write(so2+'<br>');
            so2 = so1 + so2;

        }
    }
</script>
</body>
</html>
