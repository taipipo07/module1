<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tổng 20 Số Fibonacci</title>
</head>
<body>
<script>
    let so1 = 1;
    let so2 = 1;
    let tong = 0;
    for (let i = 1; i <= 20; i++) {
        if (so1 < so2) {
            document.write(so1 + '<br>');
            tong = tong + so1;
            so1 = so1 + so2;

        } else {
            document.write(so2 + '<br>');
            tong = tong + so2;
            so2 = so1 + so2;
        }
    }
    document.write('tổng 20 số Fibonacci là: ' + tong);
</script>
</body>
</html>
