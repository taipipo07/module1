<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Số Fibonacci đầu tiên chia hết cho 5</title>
</head>
<body>
<script>
    let so1 = 0;
    let so2 = 1;
    for (let i = 1; i <= 20; i++) {
        if (so1 < so2) {
            so1 = so1 + so2;
        } else {
            so2 = so1 + so2;
        }
        if (so2 % 5 === 0) {
            document.write(so2 + 'là số chia hết cho 5 đầu tiên trong dãy fibonacci');
            break;
        }
        if (so1 % 5 === 0) {
            document.write(so1 + 'là số chia hết cho 5 đầu tiên trong dãy fibonacci');
            break;
        }
    }
</script>
</body>
</html>
