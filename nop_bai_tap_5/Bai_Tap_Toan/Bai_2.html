<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chuyển Độ</title>
</head>
<body>
<p>Nhập Độ C:</p><input type="number" id="doC"><br>
<button onclick="tinhDoF()">Chuyển Đổi</button>
<p id="ketqua"></p>
<script>
    function tinhDoF() {
        let doC = document.getElementById('doC').value;
        let doF = doC * 9 / 5 + 32;
        document.getElementById('ketqua').innerHTML = "độ F=" + doF;
    }
</script>
</body>
</html>
