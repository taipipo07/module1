<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tính Diện Tích HCN</title>
</head>
<body>
<script>
    let chieuDai = prompt('Nhap chieu dai:');
    let chieuRong = prompt('Nhap chieu rong:');
    let dienTich = chieuDai*chieuRong;
    alert("Dien Tich HCN=" + dienTich);
    document.write("chieu rong=" + chieuRong +"<br>");
    document.write("chieu dai=" + chieuDai +"<br>");
    document.write("=>dien tich=" + dienTich);
</script>
</body>
</html>
