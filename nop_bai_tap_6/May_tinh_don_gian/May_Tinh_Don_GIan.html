<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CACULATOR</title>
<style>
    body {
        margin: 0;
        padding: 0;
        /* Căn máy tính ra giữa màn hình */
        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;

        background-color: #f1f3f6;
        font-family: Arial, sans-serif;
    }

    /* Khung máy tính */
    table {
        width: 320px;
        padding: 15px;

        border-spacing: 8px;

        background-color: #222;
        border-radius: 20px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    /* Ô chứa màn hình */
    table tr:first-child td {
        padding-bottom: 10px;
    }

    /* Màn hình */
    #window {
        box-sizing: border-box;

        width: 100%;
        height: 65px;

        padding: 10px 15px;

        border: none;
        border-radius: 10px;

        background-color: #dff0d8;

        text-align: right;
        font-size: 30px;
        font-weight: bold;

        outline: none;
    }

    /* Các ô */
    td {
        width: 25%;
    }

    /* Các nút */
    input[type="button"] {
        width: 100%;
        height: 55px;

        border: none;
        border-radius: 12px;

        background-color: #444;
        color: white;

        font-size: 22px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.15s;
    }

    /* Hiệu ứng khi di chuột */
    input[type="button"]:hover {
        background-color: #666;
    }

    /* Hiệu ứng khi click */
    input[type="button"]:active {
        transform: scale(0.95);
    }
</style>
</head>
<body>
<table style="border: 5px solid red;text-align: center ">
    <tr>
        <td colspan="4"><input id="caculator" type="text"></td>
    </tr>
    <tr>
        <td><input onclick="nhap(this.value)" type="button" value="1"></td>
        <td><input onclick="nhap(this.value)" type="button" value="2"></td>
        <td><input onclick="nhap(this.value)" type="button" value="3"></td>
        <td><input onclick="nhap(this.value)" type="button" value="+"></td>
    </tr>
    <tr>
        <td><input onclick="nhap(this.value)" type="button" value="4"></td>
        <td><input onclick="nhap(this.value)" type="button" value="5"></td>
        <td><input onclick="nhap(this.value)" type="button" value="6"></td>
        <td><input onclick="nhap(this.value)" type="button" value="-"></td>
    </tr>
    <tr>
        <td><input onclick="nhap(this.value)" type="button" value="7"></td>
        <td><input onclick="nhap(this.value)" type="button" value="8"></td>
        <td><input onclick="nhap(this.value)" type="button" value="9"></td>
        <td><input onclick="nhap(this.value)" type="button" value="x"></td>
    </tr>
    <tr>
        <td><input onclick="nhap(this.value)" type="button" value="."></td>
        <td><input onclick="nhap(this.value)" type="button" value="0"></td>
        <td><input onclick="nhap(this.value)" type="button" value=":"></td>
        <td><input onclick="tinhToan()" type="button" value="="></td>
    </tr>
</table>
<script>
    function nhap(kiTu){
        document.getElementById('caculator').value += kiTu;
    }
    function tinhToan(){
        let str=document.getElementById('caculator').value;
        str=str.replace("x","*");
        str=str.replace(":","/");
        document.getElementById('caculator').value = eval(str);
    }
</script>
</body>
</html>
