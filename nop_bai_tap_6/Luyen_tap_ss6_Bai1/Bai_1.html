<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>kiểm tra a chia hết cho b</title>
</head>
<body style="text-align: center">
<h1>Kiểm tra</h1>
<input type="number" placeholder="nhập giá trị a" id="a">
<input type="number" placeholder="nhập giá trị b" id="b">
<button onclick="aChiaB()">a chia cho b</button>
<br>
<p id="ketQua"></p>
<script>
    function aChiaB() {
        let a = Number(document.getElementById("a").value);
        let b = Number(document.getElementById("b").value);
        if (b === 0) {
            document.getElementById('ketQua').interHTML = "không thể thực hiện";
        } else if (a % b === 0) {
            document.getElementById("ketQua").innerHTML = "a chia hết cho b";
        } else {
            document.getElementById("ketQua").innerHTML = "a không chia hết cho b";
        }
    }
</script>
</body>
</html>
